<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' data: blob:; style-src 'unsafe-inline' data: blob:; img-src data: blob:; font-src data: blob:; media-src data: blob:; connect-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'"><title>Isolated HTML preview</title></head><body><script>
// The iframe has no allow-same-origin permission. Receive content only from its parent.
function loadDocument(event) {
  if (event.source !== parent || event.data?.kind !== "html-studio-load" || typeof event.data.html !== "string") return;

</script></body></html>
